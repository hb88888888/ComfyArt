      // those 404 and the app dies at its first dynamic import ("Something went

      // Rate-limited to one auto-reload per 5 minutes so a truly broken state can
      // still reach the error screen instead of looping forever.
      (function () {
        var reloadOnce = function () {
          var last = 0
          try { last = Number(sessionStorage.getItem('ca-chunk-reload') || 0) } catch (e) { }
          if (Date.now() - last < 5 * 60 * 1000) return
          try { sessionStorage.setItem('ca-chunk-reload', String(Date.now())) } catch (e) { }

        }
        window.addEventListener('unhandledrejection', function (e) {

        // JS in memory. Detect a changed build entry silently and refresh once.
        var entry = document.querySelector('script[type="module"]')
